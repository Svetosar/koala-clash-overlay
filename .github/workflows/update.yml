name: Update ebuild

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a specific version (e.g. 1.4.1). Empty = latest'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: koala-clash-update
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run release pipeline
        id: release
        env:
          LATEST: ${{ inputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh

      - name: No update required
        if: steps.release.outputs.changed == 'false'
        run: echo "no update needed (latest=$(echo '${{ steps.release.outputs.version }}'))"

      - name: Open / refresh bump PR
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="bump/${VERSION:?}"
          git config user.name "koala-clash-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BR"
          git add net-proxy/
          if git diff --cached --quiet; then
            echo "no changes to commit (PR branch already has the bump)"
          else
            git commit -m "koala-clash: bump to ${VERSION}"
          fi
          git push -f origin "$BR"

          if gh pr list --head "$BR" --json number -q 'length' | grep -q '^1$'; then
            echo "PR for ${BR} already exists"
          else
            gh pr create --base main --head "$BR" \
              --title "koala-clash: bump to ${VERSION}" \
              --body "Automated bump of \`net-proxy/koala-clash\` to **${VERSION}**.

Generated from the [latest upstream release](https://github.com/coolcoala/koala-clash/releases/tag/${VERSION}).

The validate workflow runs syntax, Manifest and Gentoo-container smoke checks before merge."
          fi