name: Update ebuild

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force specific version (e.g. 1.4.0). Leave empty for latest'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      needs_update: ${{ steps.check.outputs.needs_update }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for new version
        id: check
        run: scripts/check-update.sh
        env:
          LATEST: ${{ inputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-ebuild:
    needs: check-update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ebuild
        run: chmod +x scripts/test-ebuild.sh && scripts/test-ebuild.sh

  test-manifest:
    needs: check-update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: chmod +x scripts/test-manifest.sh && scripts/test-manifest.sh

  bump-version:
    needs: [check-update, test-ebuild, test-manifest]
    if: ${{ needs.check-update.outputs.needs_update == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump ebuild version
        run: chmod +x scripts/bump-version.sh && scripts/bump-version.sh
        env:
          VERSION: ${{ needs.check-update.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: bumped
          path: .
          retention-days: 1



  create-pr:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bumped
          path: .
      - name: Create pull request
        run: |
          VERSION="${{ needs.check-update.outputs.version }}"
          BRANCH="bump/v${VERSION}"

          git config user.name "koala-clash-bot"
          git config user.email "bot@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "bump: koala-clash ${VERSION}" || echo "Nothing to commit"
          git push origin "$BRANCH"

          PR_EXISTS=$(gh pr list --head "$BRANCH" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$PR_EXISTS" -gt 0 ]; then
            echo "PR already exists for $BRANCH, skipping"
            exit 0
          fi

          gh pr create \
            --title "bump: koala-clash ${VERSION}" \
            --body "Automated bump to version ${VERSION}" \
            --base main \
            --head "$BRANCH" \
            --label automated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
