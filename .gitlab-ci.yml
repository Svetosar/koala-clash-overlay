stages:
  - check-update
  - bump-version

check-update:
  stage: check-update
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq git
  script:
    - chmod +x scripts/check-update.sh
    - ./scripts/check-update.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  only:
    - main

bump-version:
  stage: bump-version
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq git openssl
  script:
    - |
      LATEST=$(curl -s https://api.github.com/repos/coolcoala/koala-clash/releases/latest | jq -r '.tag_name | sub("^v"; "")')
      CURRENT=$(basename net-proxy/koala-clash/koala-clash-*.ebuild .ebuild | sed 's/koala-clash-//')
      if [ "$LATEST" = "$CURRENT" ] || [ -z "$LATEST" ]; then
        echo "No update needed (current: $CURRENT, latest: $LATEST)"
        exit 0
      fi
      echo "Updating from $CURRENT to $LATEST"
      cd net-proxy/koala-clash
      cp koala-clash-$CURRENT.ebuild koala-clash-$LATEST.ebuild
      sed -i "s/${PV}/${LATEST}/" koala-clash-$LATEST.ebuild
      SHA256=$(curl -sL "https://github.com/coolcoala/koala-clash/releases/download/v${LATEST}/Koala.Clash_x64.pkg.tar.xz" | sha256sum | cut -d' ' -f1)
      if [ -n "$SHA256" ]; then
        echo "DIST Koala.Clash_x64.pkg.tar.xz 0 SHA256 $SHA256" > Manifest
        ebuild koala-clash-$LATEST.ebuild digest 2>/dev/null || true
      fi
      git config user.name "koala-clash-bot"
      git config user.email "bot@localhost"
      git add .
      git commit -m "bump: koala-clash $CURRENT -> $LATEST"
      git push https://gitlab.com/${CI_PROJECT_PATH}.git HEAD:main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  only:
    - main
